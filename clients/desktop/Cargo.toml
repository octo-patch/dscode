[workspace]
resolver = "2"
members = ["core", "app"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
flume = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
uuid = { version = "1", features = ["v4"] }
